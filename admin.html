<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Cadastro de Imóvel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 min-h-screen">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-900">Cadastrar Imóvel</h2>

    <form id="form-imovel" class="space-y-4">
      
      <!-- 1. Título e Bairro -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Título do Anúncio</label>
        <input type="text" id="titulo" required placeholder="Ex: Apto 2 qtos em Botafogo" 
               class="mt-1 w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 text-base">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Bairro</label>
        <select id="bairro" required class="mt-1 w-full p-3 border rounded-lg bg-white text-base">
          <option value="">Selecione o bairro</option>
          <option value="Botafogo">Botafogo</option>
          <option value="Copacabana">Copacabana</option>
          <option value="Ipanema">Ipanema</option>
          <option value="Leblon">Leblon</option>
          <option value="Flamengo">Flamengo</option>
        </select>
      </div>

      <!-- 2. Modalidade e Preços -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Modalidade</label>
        <div class="grid grid-cols-3 gap-2">
          <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 text-sm">
            <input type="checkbox" name="modalidade" value="temporada" class="mr-2"> Temporada
          </label>
          <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 text-sm">
            <input type="checkbox" name="modalidade" value="aluguel" class="mr-2"> Aluguel
          </label>
          <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 text-sm">
            <input type="checkbox" name="modalidade" value="venda" class="mr-2"> Venda
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Diária (R$)</label>
          <input type="number" id="preco_diaria" placeholder="0" class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Mensal/Venda (R$)</label>
          <input type="number" id="preco_total" placeholder="0" class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
      </div>

      <!-- 3. Especificações do Imóvel -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700">Quartos</label>
          <input type="number" id="quartos" min="1" value="1" required class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Banheiros</label>
          <input type="number" id="banheiros" min="1" value="1" required class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Vagas Garagem</label>
          <input type="number" id="vagas" min="0" value="0" class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Área (m²)</label>
          <input type="number" id="area_m2" placeholder="Ex: 60" class="mt-1 w-full p-3 border rounded-lg text-base">
        </div>
      </div>

      <!-- 4. Fotos -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Fotos do Imóvel</label>
        <input type="file" id="fotos" multiple accept="image/*" 
               class="w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      </div>

      <!-- Botão Enviar -->
      <button type="submit" 
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow transition duration-200 text-lg">
        Salvar e Publicar
      </button>

    </form>
  </div>

  <script>
    document.getElementById('form-imovel').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const modalidades = Array.from(document.querySelectorAll('input[name="modalidade"]:checked')).map(cb => cb.value);
      
      const dadosImovel = {
        titulo: document.getElementById('titulo').value,
        bairro: document.getElementById('bairro').value,
        modalidades: modalidades,
        precos: {
          diaria: document.getElementById('preco_diaria').value || null,
          total: document.getElementById('preco_total').value || null
        },
        specs: {
          quartos: parseInt(document.getElementById('quartos').value),
          banheiros: parseInt(document.getElementById('banheiros').value),
          vagas: parseInt(document.getElementById('vagas').value),
          area_m2: parseInt(document.getElementById('area_m2').value) || null
        }
      };

      console.log('Dados prontos para salvar/enviar:', dadosImovel);
      alert('Imóvel preparado para salvar! (Ação simulada)');
    });
  </script>

</body>
</html>
