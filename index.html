<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Imóveis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 28px; color: #0f172a; margin-bottom: 8px; }
    p.subtitle { color: #64748b; font-size: 15px; }

    .grid-imoveis {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #e2e8f0;
    }

    .card-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-price {
      font-size: 22px;
      color: #16a34a;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .card-bairro {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 16px;
    }

    .card-details {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #475569;
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      margin-top: auto;
      font-weight: 500;
    }

    .loading, .empty {
      text-align: center;
      grid-column: 1 / -1;
      font-size: 16px;
      color: #64748b;
      padding: 60px 0;
    }

    /* Modal de Galeria */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal.active { display: flex; }

    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 32px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-nav {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      color: white;
    }

    .modal-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .modal-btn:hover { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>

  <header>
    <h1>Imóveis Disponíveis</h1>
    <p class="subtitle">Confira as melhores opções cadastradas</p>
  </header>

  <main id="grid-imoveis" class="grid-imoveis">
    <p class="loading">Carregando catálogo...</p>
  </main>

  <!-- Modal de Fotos -->
  <div id="modal-galeria" class="modal">
    <span class="modal-close" onclick="fecharGaleria()">&times;</span>
    <img id="modal-img" class="modal-content" src="" alt="Foto do Imóvel" />
    <div class="modal-nav">
      <button class="modal-btn" onclick="mudarFoto(-1)">❮ Anterior</button>
      <span id="modal-contador"></span>
      <button class="modal-btn" onclick="mudarFoto(1)">Próxima ❯</button>
    </div>
  </div>

  <!-- SDK do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://qkhcmmgtktngsonwneog.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFraGNtbWd0a3RuZ3NvbnduZW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTgyNjcsImV4cCI6MjEwMDQ3NDI2N30.PCNgfoNpEi1fqVL5eL_-xcCx4kMMXPHRuRz7loTJnTs';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let imoveisData = [];
    let galeriaAtual = [];
    let fotoIndexAtual = 0;

    async function carregarImoveis() {
      const container = document.getElementById('grid-imoveis');

      try {
        const { data: imoveis, error } = await supabaseClient
          .from('imoveis')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!imoveis || imoveis.length === 0) {
          container.innerHTML = '<p class="empty">Nenhum imóvel cadastrado no momento.</p>';
          return;
        }

        imoveisData = imoveis;

        container.innerHTML = imoveis.map((imovel, index) => {
          const fotos = imovel.fotos || [];
          const fotoCapa = fotos.length > 0 ? fotos[0] : 'https://via.placeholder.com/400x300?text=Sem+Foto';
          const qtdFotos = fotos.length;

          const precoFormatado = new Intl.NumberFormat('pt-BR', { 
            style: 'currency', 
            currency: 'BRL' 
          }).format(imovel.preco || 0);

          return `
            <article class="card" onclick="abrirGaleria(${index})">
              <div class="card-img-wrapper">
                <img class="card-img" src="${fotoCapa}" alt="${imovel.titulo}" loading="lazy" />
                ${qtdFotos > 1 ? `<span class="card-badge">📷 1/${qtdFotos}</span>` : ''}
              </div>
              <div class="card-content">
                <span class="card-tag">${imovel.tipo || 'Imóvel'} • ${imovel.transacao || ''}</span>
                <h2 class="card-title">${imovel.titulo}</h2>
                <p class="card-price">${precoFormatado}</p>
                <p class="card-bairro">📍 ${imovel.bairro || 'Não informado'}</p>
                
                <div class="card-details">
                  <span>📐 ${imovel.area_m2 || 0} m²</span>
                  <span>🛏️ ${imovel.quartos || 0} qts</span>
                  <span>🚗 ${imovel.vagas || 0} vagas</span>
                </div>
              </div>
            </article>
          `;
        }).join('');

      } catch (err) {
        console.error('Erro ao buscar imóveis:', err);
        container.innerHTML = '<p class="empty">Erro ao carregar o catálogo de imóveis.</p>';
      }
    }

    function abrirGaleria(imovelIndex) {
      const imovel = imoveisData[imovelIndex];
      if (!imovel || !imovel.fotos || imovel.fotos.length === 0) return;

      galeriaAtual = imovel.fotos;
      fotoIndexAtual = 0;
      atualizarModal();
      document.getElementById('modal-galeria').classList.add('active');
    }

    function fecharGaleria() {
      document.getElementById('modal-galeria').classList.remove('active');
    }

    function mudarFoto(direcao) {
      fotoIndexAtual += direcao;
      if (fotoIndexAtual < 0) fotoIndexAtual = galeriaAtual.length - 1;
      if (fotoIndexAtual >= galeriaAtual.length) fotoIndexAtual = 0;
      atualizarModal();
    }

    function atualizarModal() {
      document.getElementById('modal-img').src = galeriaAtual[fotoIndexAtual];
      document.getElementById('modal-contador').innerText = `${fotoIndexAtual + 1} de ${galeriaAtual.length}`;
    }

    carregarImoveis();
  </script>
</body>
</html>
